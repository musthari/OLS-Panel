docRoot                   $VH_ROOT/html
vhDomain                  $VH_NAME
vhAliases                 www.$VH_NAME
adminEmails               admin@$VH_NAME
enableGzip                1

errorlog $VH_ROOT/logs/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog $VH_ROOT/logs/access.log {
  useServer               0
  rollingSize             10M
  keepDays                7
}

scripthandler  {
  add                     lsapi:lsphp82 php
}

extprocessor lsphp82 {
  type                    lsapi
  address                 uds://cmd:lsphp82
  maxConns                35
  env                     LSAPI_MAX_IDLE=60
  initTimeout             60
  retryTimeout            0
}

# WordPress Permalinks & LSCache Rules
rewrite  {
  enable                  1
  autoLoadHtaccess        1
}

# Security Hardening: Restrict PHP access to VH_ROOT and disable dangerous functions
phpIniOverride  {
  php_admin_value open_basedir "$VH_ROOT/html:/tmp"
  php_admin_value disable_functions "exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source"
}